<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantern Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
        }

        canvas {
            display: block;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #drawingInterface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
        }

        #drawingInterface.active {
            display: flex;
        }

        #drawingCanvas {
            background: white;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(255, 220, 83, 0.3);
        }

        .draw-button {
            margin-top: 30px;
            padding: 15px 50px;
            background: #FFDC53;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #000;
            letter-spacing: 1px;
        }

        .draw-button:hover {
            background: #FFE680;
        }

        /* Choice Menu */
        #choiceMenu {
            position: absolute;
            display: none;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #FFDC53;
            border-radius: 8px;
            z-index: 50;
        }

        #choiceMenu.active {
            display: flex;
        }

        .choice-title {
            color: #FFFCF1;
            font-size: 14px;
            text-align: center;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .choice-button {
            padding: 12px 25px;
            background: transparent;
            border: 2px solid #FFDC53;
            color: #FFFCF1;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .choice-button:hover {
            background: #FFDC53;
            color: #000;
        }

        .color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .color-choice {
            padding: 10px 15px;
            background: transparent;
            border: 2px solid #FFDC53;
            color: #FFFCF1;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            transition: all 0.2s;
        }

        .color-choice:hover {
            background: #FFDC53;
            color: #000;
        }
    </style>
</head>
<body>
    <canvas id="mainCanvas"></canvas>

    <!-- Choice Menu -->
    <div id="choiceMenu">
        <div id="choiceContent"></div>
    </div>

    <div id="drawingInterface">
        <canvas id="drawingCanvas" width="300" height="300"></canvas>
        <button class="draw-button" onclick="app.finishDrawing()">Create Lantern</button>
    </div>

    <script>
        const app = {
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,

            // Drawing
            drawingCanvas: null,
            drawingCtx: null,
            isDrawing: false,
            drawingPoints: [],

            // Lanterns
            lanterns: [],
            activeLantern: null,
            focusedLantern: null,
            pendingLanternType: null,

            // Matchsticks
            matchsticks: [
                { color: 'Blue', flameColor: '#4A90E2', glowColor: '#B3D9FF', x: 0, y: 0 },
                { color: 'Green', flameColor: '#7ED321', glowColor: '#C8F7C5', x: 0, y: 0 },
                { color: 'Purple', flameColor: '#BD10E0', glowColor: '#E8B3FF', x: 0, y: 0 },
                { color: 'Pink', flameColor: '#FF6B9D', glowColor: '#FFB3D9', x: 0, y: 0 },
                { color: 'Red', flameColor: '#E74C3C', glowColor: '#FFB3B3', x: 0, y: 0 },
                { color: 'Yellow', flameColor: '#FFD700', glowColor: '#FFFAED', x: 0, y: 0 }
            ],
            draggedMatchstick: null,
            matchstickDragOffset: { x: 0, y: 0 },

            // Interaction
            isDragging: false,
            dragMode: null,
            lastMouseX: 0,
            lastMouseY: 0,
            currentMouseX: 0,
            currentMouseY: 0,

            // Animation
            time: 0,

            // Colors
            colors: {
                wall: '#FFFCF1',
                table: '#B5AB9C',
                tableDark: '#9A907F',
                lanternGold: '#FFDC53'
            },


            getTablePolygon() {
                const w = this.width;
                const h = this.height;
                return [
                    { x: w * 0.05, y: h * 0.62 },
                    { x: w * 0.35, y: h * 0.62 },
                    { x: w * 0.45, y: h * 0.95 },
                    { x: 0, y: h * 0.95 }
                ];
            },

            updateMatchstickPositions() {
                const startY = this.height * 0.2;
                const spacing = this.height * 0.1;
                const x = this.width - 50;

                for (let i = 0; i < this.matchsticks.length; i++) {
                    this.matchsticks[i].x = x;
                    this.matchsticks[i].y = startY + i * spacing;
                }
            },

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            },

            blendColors(color1, color2, ratio) {
                const rgb1 = this.hexToRgb(color1);
                const rgb2 = this.hexToRgb(color2);
                if (!rgb1 || !rgb2) return color1;

                const r = Math.round(rgb1.r * (1 - ratio) + rgb2.r * ratio);
                const g = Math.round(rgb1.g * (1 - ratio) + rgb2.g * ratio);
                const b = Math.round(rgb1.b * (1 - ratio) + rgb2.b * ratio);

                return `rgb(${r}, ${g}, ${b})`;
            },

            isPointInPolygon(x, y, polygon) {
                let inside = false;
                for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                    const xi = polygon[i].x, yi = polygon[i].y;
                    const xj = polygon[j].x, yj = polygon[j].y;

                    const intersect = ((yi > y) !== (yj > y))
                        && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                    if (intersect) inside = !inside;
                }
                return inside;
            },

            constrainToTable(x, y) {
                const polygon = this.getTablePolygon();

                // Simple constraint: check if point is in polygon, if not, clamp to nearest edge
                if (this.isPointInPolygon(x, y, polygon)) {
                    return { x, y };
                }

                // Find closest point on polygon edges
                let minDist = Infinity;
                let closestX = x;
                let closestY = y;

                for (let i = 0; i < polygon.length; i++) {
                    const p1 = polygon[i];
                    const p2 = polygon[(i + 1) % polygon.length];

                    // Project point onto line segment
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const t = Math.max(0, Math.min(1, ((x - p1.x) * dx + (y - p1.y) * dy) / (dx * dx + dy * dy)));
                    const projX = p1.x + t * dx;
                    const projY = p1.y + t * dy;

                    const dist = Math.sqrt((x - projX) ** 2 + (y - projY) ** 2);
                    if (dist < minDist) {
                        minDist = dist;
                        closestX = projX;
                        closestY = projY;
                    }
                }

                // Move point slightly inward from edge
                const centerX = (polygon[0].x + polygon[1].x + polygon[2].x + polygon[3].x) / 4;
                const centerY = (polygon[0].y + polygon[1].y + polygon[2].y + polygon[3].y) / 4;
                const toCenter = { x: centerX - closestX, y: centerY - closestY };
                const mag = Math.sqrt(toCenter.x ** 2 + toCenter.y ** 2);

                return {
                    x: closestX + (toCenter.x / mag) * 20,
                    y: closestY + (toCenter.y / mag) * 20
                };
            },

            init() {
                this.canvas = document.getElementById('mainCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.drawingCanvas = document.getElementById('drawingCanvas');
                this.drawingCtx = this.drawingCanvas.getContext('2d');

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.setupEventListeners();
                this.animate();
            },

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.updateMatchstickPositions();
            },

            setupEventListeners() {
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.handleMouseUp());
                this.canvas.addEventListener('dblclick', (e) => this.handleDoubleClick(e));

                this.drawingCanvas.addEventListener('mousedown', (e) => {
                    this.isDrawing = true;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints = [{
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    }];
                });

                this.drawingCanvas.addEventListener('mousemove', (e) => {
                    if (!this.isDrawing) return;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints.push({
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    });
                    this.updateDrawing();
                });

                this.drawingCanvas.addEventListener('mouseup', () => {
                    this.isDrawing = false;
                });
            },

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check matchsticks
                for (let matchstick of this.matchsticks) {
                    const dist = Math.sqrt((x - matchstick.x) ** 2 + (y - matchstick.y) ** 2);
                    if (dist < 25) {
                        this.draggedMatchstick = matchstick;
                        this.matchstickDragOffset.x = x - matchstick.x;
                        this.matchstickDragOffset.y = y - matchstick.y;
                        return;
                    }
                }

                // Check glowing dot
                const polygon = this.getTablePolygon();
                const dotX = polygon[3].x + (polygon[2].x - polygon[3].x) * 0.15;
                const dotY = polygon[3].y - 40;
                const dist = Math.sqrt((x - dotX) ** 2 + (y - dotY) ** 2);

                if (dist < 20 && !this.focusedLantern) {
                    document.getElementById('drawingInterface').classList.add('active');
                    return;
                }

                // Check lanterns (larger hit detection for bigger lanterns)
                for (let lantern of this.lanterns) {
                    const lDist = Math.sqrt((x - lantern.x) ** 2 + (y - lantern.y) ** 2);
                    if (lDist < 110) {
                        this.activeLantern = lantern;
                        this.isDragging = true;
                        this.dragMode = 'rotate';
                        this.lastMouseX = x;
                        this.lastMouseY = y;
                        return;
                    }
                }
            },

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                this.currentMouseX = x;
                this.currentMouseY = y;

                // Handle matchstick dragging
                if (this.draggedMatchstick) {
                    const matchstickX = x - this.matchstickDragOffset.x;
                    const matchstickY = y - this.matchstickDragOffset.y;

                    // Check collision with any lantern's candle
                    for (let lantern of this.lanterns) {
                        const candleX = lantern.x;
                        const candleY = lantern.y + lantern.height;
                        const dist = Math.sqrt((matchstickX - candleX) ** 2 + (matchstickY - candleY) ** 2);

                        if (dist < 30) {
                            // Change flame color
                            lantern.glowColor = this.draggedMatchstick.glowColor;
                            lantern.flameColor = this.draggedMatchstick.flameColor;
                        }
                    }
                    return;
                }

                if (!this.isDragging || !this.activeLantern) return;

                const deltaX = x - this.lastMouseX;
                const deltaY = y - this.lastMouseY;

                // Check if movement is more horizontal (rotate) or general (move)
                if (Math.abs(deltaX) > Math.abs(deltaY) * 2 && this.dragMode === 'rotate') {
                    // Horizontal drag = rotation (immediate, no momentum)
                    this.activeLantern.rotation += deltaX * 0.02;
                } else {
                    // Free movement in all directions with table constraints
                    const newX = this.activeLantern.x + deltaX;
                    const newY = this.activeLantern.y + deltaY;
                    const constrained = this.constrainToTable(newX, newY);
                    this.activeLantern.x = constrained.x;
                    this.activeLantern.y = constrained.y;
                }

                this.lastMouseX = x;
                this.lastMouseY = y;
            },

            handleMouseUp() {
                // Stop rotation immediately (no momentum)
                if (this.activeLantern) {
                    this.activeLantern.rotationSpeed = 0;
                }
                this.isDragging = false;
                this.dragMode = null;
                this.activeLantern = null;
                this.draggedMatchstick = null;
            },

            handleDoubleClick(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (this.focusedLantern) {
                    // Zoom out
                    this.focusedLantern = null;
                    return;
                }

                // Check if double-clicking on a lantern (larger hit detection)
                for (let lantern of this.lanterns) {
                    const lDist = Math.sqrt((x - lantern.x) ** 2 + (y - lantern.y) ** 2);
                    if (lDist < 110) {
                        this.focusedLantern = lantern;
                        return;
                    }
                }
            },


            updateDrawing() {
                const ctx = this.drawingCtx;
                ctx.clearRect(0, 0, 300, 300);

                if (this.drawingPoints.length < 2) return;

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.moveTo(this.drawingPoints[0].x, this.drawingPoints[0].y);

                for (let i = 1; i < this.drawingPoints.length; i++) {
                    ctx.lineTo(this.drawingPoints[i].x, this.drawingPoints[i].y);
                }

                ctx.closePath();
                ctx.fill();
            },

            finishDrawing() {
                if (this.drawingPoints.length < 3) return;

                const silhouetteCanvas = document.createElement('canvas');
                silhouetteCanvas.width = 300;
                silhouetteCanvas.height = 300;
                const sCtx = silhouetteCanvas.getContext('2d');
                sCtx.drawImage(this.drawingCanvas, 0, 0);

                const polygon = this.getTablePolygon();
                const dotX = polygon[3].x + (polygon[2].x - polygon[3].x) * 0.15;
                const dotY = polygon[3].y - 40;

                // Generate random height between 80 and 120
                const randomHeight = 80 + Math.random() * 40;

                this.lanterns.push({
                    type: 'carousel',
                    x: dotX,
                    y: dotY - randomHeight,
                    rotation: 0,
                    rotationSpeed: 0,
                    silhouette: silhouetteCanvas,
                    height: randomHeight,
                    glowColor: '#FFFAED'
                });

                document.getElementById('drawingInterface').classList.remove('active');
                this.drawingCtx.clearRect(0, 0, 300, 300);
                this.drawingPoints = [];
            },

            animate() {
                this.time += 0.016;

                this.ctx.clearRect(0, 0, this.width, this.height);

                if (this.focusedLantern) {
                    this.renderFocusedView();
                } else {
                    this.renderRoom();
                    this.renderShadows();
                    this.renderLanterns();
                    this.renderGlowingDot();
                    this.renderMatchsticks();
                    this.renderDarkOverlay();
                }

                this.updatePhysics();

                requestAnimationFrame(() => this.animate());
            },

            renderRoom() {
                const ctx = this.ctx;

                ctx.fillStyle = this.colors.wall;
                ctx.fillRect(0, 0, this.width, this.height);

                const polygon = this.getTablePolygon();

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(polygon[0].x, polygon[0].y);
                for (let i = 1; i < polygon.length; i++) {
                    ctx.lineTo(polygon[i].x, polygon[i].y);
                }
                ctx.closePath();

                const tableGradient = ctx.createLinearGradient(0, polygon[0].y, 0, polygon[3].y);
                tableGradient.addColorStop(0, '#C8BFB0');
                tableGradient.addColorStop(0.4, this.colors.table);
                tableGradient.addColorStop(1, '#7A7060');

                ctx.fillStyle = tableGradient;
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 252, 241, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(polygon[0].x, polygon[0].y);
                ctx.lineTo(polygon[1].x, polygon[1].y);
                ctx.stroke();

                ctx.restore();
            },

            renderShadows() {
                const ctx = this.ctx;
                const wallX = this.width * 0.5;

                for (let lantern of this.lanterns) {
                    this.renderCarouselShadows(lantern, wallX);
                }
            },

            renderCarouselShadows(lantern, wallX) {
                const ctx = this.ctx;
                const candleX = lantern.x;
                const candleY = lantern.y + lantern.height;

                // Calculate distance to wall
                const distToWall = Math.abs(wallX - lantern.x);
                const maxDist = this.width * 0.35;
                const distRatio = Math.min(distToWall / maxDist, 1);

                // Map distance to shadow scale (1.3 to 1.8) and multiply by 1.6×
                const baseScale = 1.3 + (1.8 - 1.3) * distRatio;
                const shadowScale = baseScale * 1.6;

                // Map distance to shadow opacity (0.55 to 0.25)
                const shadowOpacity = 0.55 - (0.55 - 0.25) * distRatio;

                // Get flame color for subtle tinting
                const flameColor = lantern.flameColor || '#FFD700';

                // Match the larger lantern dimensions
                const mountRadius = 55;
                const charmDropHeight = 80;

                // Render individual charm shadows (6-petal pattern)
                for (let i = 0; i < 6; i++) {
                    const angle = lantern.rotation + (i / 6) * Math.PI * 2;
                    const charmX = lantern.x + Math.cos(angle) * mountRadius;
                    const charmY = lantern.y + Math.sin(angle) * mountRadius * 0.3 + charmDropHeight;

                    const dx = charmX - candleX;
                    const dy = charmY - candleY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    const shadowDist = 280;
                    const shadowX = wallX + (dx / dist) * shadowDist;
                    const shadowY = this.height * 0.4 + (dy / dist) * shadowDist * 0.4;

                    // Sharp shadow with 8-15px edge feather, scaled for larger charms
                    ctx.save();
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.globalAlpha = shadowOpacity;
                    ctx.filter = 'blur(12px)';

                    ctx.translate(shadowX, shadowY);
                    ctx.rotate(lantern.rotation + (i / 6) * Math.PI * 2);
                    ctx.scale(0.12 * shadowScale, 0.12 * shadowScale);
                    ctx.translate(-150, -150);

                    ctx.drawImage(lantern.silhouette, 0, 0);

                    // Add subtle flame color tint to shadow
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.globalAlpha = 0.08;
                    ctx.fillStyle = flameColor;
                    ctx.fillRect(0, 0, 300, 300);

                    ctx.restore();
                }
            },


            renderLanterns() {
                for (let lantern of this.lanterns) {
                    this.renderCandle(lantern.x, lantern.y + lantern.height, lantern.glowColor, lantern.flameColor);
                    this.renderCarouselLantern(lantern);
                }
            },

            renderCarouselLantern(lantern) {
                const ctx = this.ctx;
                const x = lantern.x;
                const y = lantern.y;

                // Tint colors based on flame color (subtle 15% blend)
                const flameColor = lantern.flameColor || '#FFD700';
                const glowColor = lantern.glowColor || '#FFFAED';
                const tintedGold = this.blendColors(this.colors.lanternGold, flameColor, 0.15);
                const tintedHighlight = this.blendColors('#FFFFC8', flameColor, 0.2);

                // Add illumination from flame on nearby surfaces
                const pulse = Math.sin(this.time * 4) * 0.06 + 0.94;
                ctx.save();
                ctx.globalAlpha = 0.3 * pulse;
                ctx.filter = 'blur(25px)';
                const illumination = ctx.createRadialGradient(x, y + lantern.height, 0, x, y + lantern.height, 90);
                illumination.addColorStop(0, glowColor);
                illumination.addColorStop(1, 'rgba(255, 220, 83, 0)');
                ctx.fillStyle = illumination;
                ctx.fillRect(x - 90, y - 20, 180, 180);
                ctx.restore();

                // Increased sizes
                const ringRadius = 70; // Increased from 50
                const mountRadius = 55; // Increased from 38
                const charmScale = 0.12; // Increased from 0.08
                const charmDropHeight = 80; // Increased from 60

                // Base (gold with micro-3D) - larger
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 3;
                ctx.fillStyle = tintedGold;
                ctx.beginPath();
                ctx.arc(x, y + lantern.height, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Highlight on base
                ctx.fillStyle = tintedHighlight.replace('rgb', 'rgba').replace(')', ', 0.4)');
                ctx.beginPath();
                ctx.arc(x - 4, y + lantern.height - 4, 10, 0, Math.PI * 2);
                ctx.fill();

                // Vertical stand (static, doesn't rotate) - thicker
                ctx.strokeStyle = tintedGold;
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(x, y + lantern.height);
                ctx.lineTo(x, y);
                ctx.stroke();

                // Inner shadow on stand
                ctx.strokeStyle = this.blendColors('#C8A01E', flameColor, 0.15).replace('rgb', 'rgba').replace(')', ', 0.5)');
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x + 1.5, y + lantern.height);
                ctx.lineTo(x + 1.5, y);
                ctx.stroke();

                // Top ring (elliptical perspective - rotates)
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(1, 0.3);

                // Outer ring
                ctx.strokeStyle = tintedGold;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                ctx.stroke();

                // Inner shadow
                ctx.strokeStyle = this.blendColors('#C8A01E', flameColor, 0.15).replace('rgb', 'rgba').replace(')', ', 0.6)');
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius - 3, 0, Math.PI * 2);
                ctx.stroke();

                // Inner ring
                ctx.strokeStyle = tintedGold;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius - 7, 0, Math.PI * 2);
                ctx.stroke();

                // Highlight arc
                ctx.strokeStyle = tintedHighlight.replace('rgb', 'rgba').replace(')', ', 0.6)');
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, ringRadius, Math.PI * 1.2, Math.PI * 1.5);
                ctx.stroke();

                ctx.restore();

                // 6 charms (rotate with ring) - with flame color tint
                for (let i = 0; i < 6; i++) {
                    const angle = lantern.rotation + (i / 6) * Math.PI * 2;
                    const mountX = x + Math.cos(angle) * mountRadius;
                    const mountY = y + Math.sin(angle) * mountRadius * 0.3;
                    const charmX = mountX;
                    const charmY = y + charmDropHeight;

                    // Wire
                    ctx.strokeStyle = this.blendColors('#C8B478', flameColor, 0.15).replace('rgb', 'rgba').replace(')', ', 0.9)');
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(mountX, mountY);
                    ctx.lineTo(charmX, charmY);
                    ctx.stroke();

                    // Charm with flame color tint overlay
                    ctx.save();
                    ctx.translate(charmX, charmY);
                    ctx.scale(charmScale, charmScale);
                    ctx.translate(-150, -150);

                    // Draw base silhouette
                    ctx.drawImage(lantern.silhouette, 0, 0);

                    // Apply subtle flame color tint
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.globalAlpha = 0.1;
                    ctx.fillStyle = flameColor;
                    ctx.fillRect(0, 0, 300, 300);

                    ctx.restore();
                }
            },


            renderCandle(x, y, glowColor, flameColor) {
                const ctx = this.ctx;
                const pulse = Math.sin(this.time * 4) * 0.06 + 0.94;
                const flicker = Math.sin(this.time * 6) * 0.03;

                flameColor = flameColor || '#FFD700';

                // Radial glow (point light source - larger and more prominent)
                ctx.save();
                ctx.globalAlpha = 0.5 * pulse;
                ctx.filter = 'blur(45px)';
                const outerGlow = ctx.createRadialGradient(x, y - 10, 0, x, y - 10, 120);
                outerGlow.addColorStop(0, glowColor);
                outerGlow.addColorStop(0.5, glowColor.replace(')', ', 0.3)').replace('rgb', 'rgba'));
                outerGlow.addColorStop(1, 'rgba(255, 220, 83, 0)');
                ctx.fillStyle = outerGlow;
                ctx.fillRect(x - 120, y - 130, 240, 240);
                ctx.restore();

                // Inner bright glow
                ctx.save();
                ctx.globalAlpha = 0.7 * pulse;
                ctx.filter = 'blur(20px)';
                const innerGlow = ctx.createRadialGradient(x, y - 10, 0, x, y - 10, 50);
                innerGlow.addColorStop(0, flameColor);
                innerGlow.addColorStop(1, 'rgba(255, 220, 83, 0)');
                ctx.fillStyle = innerGlow;
                ctx.fillRect(x - 50, y - 60, 100, 100);
                ctx.restore();

                // Diptyque-style candle body (cylindrical)
                const candleWidth = 10;
                const candleHeight = 18;

                // Shadow on candle
                ctx.fillStyle = 'rgba(150, 130, 100, 0.25)';
                ctx.fillRect(x + candleWidth/2 - 1, y - 5, 2, candleHeight);

                // Main candle body (light beige)
                const candleGradient = ctx.createLinearGradient(x - candleWidth/2, 0, x + candleWidth/2, 0);
                candleGradient.addColorStop(0, '#D8CDB5');
                candleGradient.addColorStop(0.5, '#E8D5B7');
                candleGradient.addColorStop(1, '#D0C5AD');
                ctx.fillStyle = candleGradient;
                ctx.fillRect(x - candleWidth/2, y - 5, candleWidth, candleHeight);

                // Top rim of candle
                ctx.fillStyle = '#C8BFB0';
                ctx.fillRect(x - candleWidth/2, y - 6, candleWidth, 1);

                // Wick
                ctx.strokeStyle = '#2C2C2C';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(x, y - 6);
                ctx.lineTo(x, y - 12);
                ctx.stroke();

                // Realistic flame shape (teardrop)
                ctx.save();
                ctx.translate(x + flicker * 2, y - 12);

                // Outer flame glow
                ctx.globalAlpha = 0.4;
                ctx.fillStyle = flameColor;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-4, -3, -4, -8, 0, -12 * pulse);
                ctx.bezierCurveTo(4, -8, 4, -3, 0, 0);
                ctx.closePath();
                ctx.fill();

                // Main flame body
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = flameColor;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-3, -2, -3, -6, 0, -10 * pulse);
                ctx.bezierCurveTo(3, -6, 3, -2, 0, 0);
                ctx.closePath();
                ctx.fill();

                // Inner bright core
                ctx.globalAlpha = 1;
                ctx.fillStyle = '#FFFAF0';
                ctx.beginPath();
                ctx.moveTo(0, -1);
                ctx.bezierCurveTo(-1.5, -2, -1.5, -4, 0, -6 * pulse);
                ctx.bezierCurveTo(1.5, -4, 1.5, -2, 0, -1);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            },

            renderGlowingDot() {
                const ctx = this.ctx;
                const polygon = this.getTablePolygon();
                const x = polygon[3].x + (polygon[2].x - polygon[3].x) * 0.15;
                const y = polygon[3].y - 40;

                const pulse = Math.sin(this.time * 2) * 0.5 + 0.5;

                for (let i = 0; i < 3; i++) {
                    const phase = (this.time * 1.5 + i * 0.4) % 1;
                    const radius = 10 + phase * 30;
                    const alpha = (1 - phase) * 0.4;

                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = `rgba(255, 255, 255, ${0.8 + pulse * 0.2})`;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
            },

            renderMatchsticks() {
                const ctx = this.ctx;

                for (let matchstick of this.matchsticks) {
                    if (matchstick === this.draggedMatchstick) continue;

                    const x = matchstick.x;
                    const y = matchstick.y;

                    // Matchstick stick (elegant wooden part)
                    const woodGradient = ctx.createLinearGradient(x - 2, 0, x + 2, 0);
                    woodGradient.addColorStop(0, '#C09A6B');
                    woodGradient.addColorStop(0.5, '#D2A679');
                    woodGradient.addColorStop(1, '#B8936D');
                    ctx.fillStyle = woodGradient;
                    ctx.fillRect(x - 1.5, y - 22, 3, 35);

                    // Matchstick head (colored tip with shading)
                    ctx.fillStyle = matchstick.flameColor;
                    ctx.beginPath();
                    ctx.ellipse(x, y - 24, 4, 5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Highlight on tip
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.beginPath();
                    ctx.ellipse(x - 1.5, y - 25, 1.5, 2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Subtle glow
                    ctx.save();
                    ctx.globalAlpha = 0.25;
                    ctx.filter = 'blur(6px)';
                    ctx.fillStyle = matchstick.glowColor;
                    ctx.beginPath();
                    ctx.arc(x, y - 24, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Render dragged matchstick on top
                if (this.draggedMatchstick) {
                    const mouseX = this.currentMouseX || this.draggedMatchstick.x;
                    const mouseY = this.currentMouseY || this.draggedMatchstick.y;
                    const x = mouseX - this.matchstickDragOffset.x;
                    const y = mouseY - this.matchstickDragOffset.y;

                    // Enhanced glow when dragging
                    ctx.save();
                    ctx.globalAlpha = 0.6;
                    ctx.filter = 'blur(20px)';
                    ctx.fillStyle = this.draggedMatchstick.glowColor;
                    ctx.beginPath();
                    ctx.arc(x, y - 24, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Matchstick stick
                    const woodGradient = ctx.createLinearGradient(x - 2, 0, x + 2, 0);
                    woodGradient.addColorStop(0, '#C09A6B');
                    woodGradient.addColorStop(0.5, '#D2A679');
                    woodGradient.addColorStop(1, '#B8936D');
                    ctx.fillStyle = woodGradient;
                    ctx.fillRect(x - 1.5, y - 22, 3, 35);

                    // Matchstick head
                    ctx.fillStyle = this.draggedMatchstick.flameColor;
                    ctx.beginPath();
                    ctx.ellipse(x, y - 24, 4, 5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Highlight on tip
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.ellipse(x - 1.5, y - 25, 1.5, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            },

            renderDarkOverlay() {
                const ctx = this.ctx;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.50)';
                ctx.fillRect(0, 0, this.width, this.height);
            },

            renderFocusedView() {
                const lantern = this.focusedLantern;

                // Dark background
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                this.ctx.fillRect(0, 0, this.width, this.height);

                // Render only this lantern and its shadow
                const centerX = this.width * 0.3;
                const centerY = this.height * 0.5;

                this.ctx.save();
                this.ctx.translate(centerX - lantern.x, centerY - lantern.y);

                // Shadow
                const wallX = this.width * 0.65;
                this.renderCarouselShadows(lantern, wallX);

                // Lantern
                this.renderCandle(lantern.x, lantern.y + lantern.height, lantern.glowColor, lantern.flameColor);
                this.renderCarouselLantern(lantern);

                this.ctx.restore();

                // Instructions
                this.ctx.fillStyle = 'rgba(255, 252, 241, 0.7)';
                this.ctx.font = '14px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('Double-click anywhere to return', this.width / 2, this.height - 40);
            },

            updatePhysics() {
                // No physics - rotation controlled directly by user drag only
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
