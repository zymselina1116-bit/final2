<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Art Exhibition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ui-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .ui-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .button {
            padding: 10px 18px;
            background: #2c2c2c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 0.3px;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 8px;
        }

        .button:hover {
            background: #404040;
        }

        .button:last-child {
            margin-bottom: 0;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.selected {
            border-color: #2c2c2c;
            box-shadow: 0 0 0 2px white;
        }

        #drawing-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
        }

        #drawing-interface.active {
            display: flex;
        }

        #drawingCanvas {
            background: white;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .draw-button {
            margin-top: 20px;
            padding: 12px 40px;
            background: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #2c2c2c;
            letter-spacing: 0.5px;
            border-radius: 6px;
            font-weight: 600;
        }

        .draw-button:hover {
            background: #f0f0f0;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            text-align: center;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-overlay"></div>

    <!-- Choice Menu (appears when clicking glowing point) -->
    <div id="choiceMenu" style="position: absolute; display: none; flex-direction: column; gap: 12px; padding: 20px; background: rgba(255,255,255,0.95); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 150;">
        <div style="font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; text-align: center;">Add Object</div>
        <button class="choice-btn" onclick="app.createSpotlight()" style="padding: 12px 24px; background: #2c2c2c; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s;">Spotlight</button>
        <button class="choice-btn" onclick="app.createPanel()" style="padding: 12px 24px; background: #2c2c2c; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s;">Panel</button>
        <button class="choice-btn" onclick="app.createCarousel()" style="padding: 12px 24px; background: #2c2c2c; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s;">Carousel</button>
    </div>

    <div id="drawing-interface">
        <div style="margin-bottom: 20px; text-align: center;">
            <div style="font-size: 13px; font-weight: 600; color: white; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">Panel Material</div>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button id="materialNormal" class="material-btn" onclick="app.selectPanelMaterial('normal')" style="padding: 10px 24px; background: white; color: #2c2c2c; border: 2px solid white; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">Normal (Cloth)</button>
                <button id="materialLaser" class="material-btn" onclick="app.selectPanelMaterial('laser')" style="padding: 10px 24px; background: transparent; color: white; border: 2px solid white; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">Laser (Holographic)</button>
            </div>
        </div>
        <canvas id="drawingCanvas" width="400" height="400"></canvas>
        <button class="draw-button" onclick="app.finishDrawing()">Create Panel</button>
    </div>

    <div id="instructions">
        Drag to look around • Click glowing point to add objects • Drag objects to move/rotate
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const app = {
            scene: null,
            camera: null,
            renderer: null,
            container: null,

            // Room dimensions
            roomSize: { width: 20, height: 6, depth: 20 }, // 6m ceiling height (5-6m range)

            // Objects
            carousels: [],
            panels: [],
            spotlights: [],
            selectedObject: null,
            selectedLight: null,
            placementMode: null, // 'carousel' or 'panel'
            placementIndicator: null,

            // Interaction
            isDragging: false,
            isRotatingView: false,
            lastMouseX: 0,
            lastMouseY: 0,
            lookRotation: { yaw: 0, pitch: -Math.PI / 18 }, // Downward tilt (~10°) elevated observer view

            // Glowing point
            glowingPoint: null,
            glowingPointPosition: new THREE.Vector3(0, 0, 0),

            // Drawing
            drawingCanvas: null,
            drawingCtx: null,
            isDrawing: false,
            drawingPoints: [],
            panelMaterial: 'normal', // 'normal' or 'laser'

            // Colors
            lightColors: [
                '#FFFFFF', '#FFE5B4', '#FFD700', '#FFA500',
                '#FF6B6B', '#FF1493', '#9370DB', '#6495ED',
                '#4169E1', '#00CED1', '#00FA9A', '#32CD32'
            ],
            currentLightColor: '#FFFFFF',

            init() {
                this.container = document.getElementById('canvas-container');

                // Setup Three.js
                this.scene = new THREE.Scene();
                // Dark grey background (not pure black) - simulates unlit gallery space
                this.scene.background = new THREE.Color(0x0a0a0a);

                this.camera = new THREE.PerspectiveCamera(
                    60, // Wider FOV for better room view
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.updateCameraPosition();

                this.renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    logarithmicDepthBuffer: true // Better depth precision for multi-layer shadows
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);

                // PHOTOGRAPHIC TONE MAPPING - soft filmic look, avoid crushing blacks
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.0; // Natural exposure

                // MULTI-LAYER SHADOW COMPOSITING - all objects contribute to shadows
                // PCFSoftShadowMap naturally supports multiple shadow layers
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.shadowMap.autoUpdate = true;
                this.renderer.shadowMap.needsUpdate = true;

                this.container.appendChild(this.renderer.domElement);

                // Setup drawing
                this.drawingCanvas = document.getElementById('drawingCanvas');
                this.drawingCtx = this.drawingCanvas.getContext('2d');

                // Build room
                this.createRoom();

                // Create glowing point
                this.createGlowingPoint();

                // Event listeners
                this.setupEventListeners();

                // Start animation
                this.animate();
            },

            createRoom() {
                const { width, height, depth } = this.roomSize;

                // Floor - slightly off-white (#F5F5F5) like real gallery
                const floorGeometry = new THREE.PlaneGeometry(width, depth);
                const floorMaterial = new THREE.MeshStandardMaterial({
                    color: 0xf5f5f5, // #F5F5F5 - slightly off-white
                    roughness: 0.8,
                    metalness: 0.0 // No metalness for pure white appearance
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                this.scene.add(floor);

                // Walls - PURE WHITE (#FFFFFF) like modern museum
                const wallMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff, // #FFFFFF - pure white
                    roughness: 0.9,
                    metalness: 0.0 // No metalness for pure white appearance
                });

                // Back wall
                const backWall = new THREE.Mesh(
                    new THREE.PlaneGeometry(width, height),
                    wallMaterial
                );
                backWall.position.set(0, height / 2, -depth / 2);
                backWall.receiveShadow = true;
                this.scene.add(backWall);

                // Left wall
                const leftWall = new THREE.Mesh(
                    new THREE.PlaneGeometry(depth, height),
                    wallMaterial
                );
                leftWall.position.set(-width / 2, height / 2, 0);
                leftWall.rotation.y = Math.PI / 2;
                leftWall.receiveShadow = true;
                this.scene.add(leftWall);

                // Right wall
                const rightWall = new THREE.Mesh(
                    new THREE.PlaneGeometry(depth, height),
                    wallMaterial
                );
                rightWall.position.set(width / 2, height / 2, 0);
                rightWall.rotation.y = -Math.PI / 2;
                rightWall.receiveShadow = true;
                this.scene.add(rightWall);

                // Front wall (completes the enclosed room)
                const frontWall = new THREE.Mesh(
                    new THREE.PlaneGeometry(width, height),
                    wallMaterial
                );
                frontWall.position.set(0, height / 2, depth / 2);
                frontWall.rotation.y = Math.PI;
                frontWall.receiveShadow = true;
                this.scene.add(frontWall);

                // Ceiling - PURE WHITE (#FFFFFF) like modern museum
                const ceilingMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff, // #FFFFFF - pure white
                    roughness: 0.9,
                    metalness: 0.0
                });
                const ceiling = new THREE.Mesh(
                    new THREE.PlaneGeometry(width, depth),
                    ceilingMaterial
                );
                ceiling.position.y = height;
                ceiling.rotation.x = Math.PI / 2;
                this.scene.add(ceiling);

                // VERY LOW ambient light (0.05) - darkness through lighting, NOT grey walls
                // White color (#FFFFFF) but very dim intensity
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
                this.scene.add(ambientLight);

                // Subtle edge lighting for corner definition (very soft, white tone)
                const edgeLight1 = new THREE.DirectionalLight(0xffffff, 0.08);
                edgeLight1.position.set(width/2, height, depth/2);
                this.scene.add(edgeLight1);

                const edgeLight2 = new THREE.DirectionalLight(0xffffff, 0.08);
                edgeLight2.position.set(-width/2, height, -depth/2);
                this.scene.add(edgeLight2);

                // Add a default white spotlight
                const defaultSpotlight = this.createSpotlightObject();
                defaultSpotlight.position.set(-2, 0, 0);
                this.scene.add(defaultSpotlight);
                this.spotlights.push(defaultSpotlight);
            },

            getWallFacing() {
                // Determine which wall user is looking at based on camera direction
                const lookX = Math.cos(this.lookRotation.yaw) * Math.cos(this.lookRotation.pitch);
                const lookY = Math.sin(this.lookRotation.pitch);
                const lookZ = Math.sin(this.lookRotation.yaw) * Math.cos(this.lookRotation.pitch);

                // Don't spawn if looking at floor or ceiling
                if (Math.abs(lookY) > 0.7) {
                    return null; // Looking too far up or down
                }

                // Determine which wall based on strongest horizontal component
                const absX = Math.abs(lookX);
                const absZ = Math.abs(lookZ);

                if (absX > absZ) {
                    // Looking more in X direction
                    return lookX > 0 ? 'right' : 'left';
                } else {
                    // Looking more in Z direction
                    return lookZ > 0 ? 'front' : 'back';
                }
            },

            getPositionForWall(wall) {
                // Get spawn position in front of the specified wall
                const { width, depth } = this.roomSize;
                const distance = 3; // Distance from wall

                switch (wall) {
                    case 'back':
                        return { x: 0, z: -depth / 2 + distance, rotation: 0 };
                    case 'front':
                        return { x: 0, z: depth / 2 - distance, rotation: Math.PI };
                    case 'left':
                        return { x: -width / 2 + distance, z: 0, rotation: Math.PI / 2 };
                    case 'right':
                        return { x: width / 2 - distance, z: 0, rotation: -Math.PI / 2 };
                    default:
                        return { x: 0, z: 0, rotation: 0 };
                }
            },

            createGlowingPoint() {
                // Pulsing white glowing point on floor
                const geometry = new THREE.SphereGeometry(0.15, 32, 32);
                const material = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    emissive: 0xffffff,
                    emissiveIntensity: 1,
                    metalness: 0,
                    roughness: 0.2
                });
                this.glowingPoint = new THREE.Mesh(geometry, material);
                this.glowingPoint.position.set(0, 0.15, 0); // FIXED on floor center - NEVER moves
                this.glowingPoint.userData.type = 'glowingPoint';
                this.scene.add(this.glowingPoint);

                // Add glow effect
                const glowGeometry = new THREE.SphereGeometry(0.3, 32, 32);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.3
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                this.glowingPoint.add(glow);
            },


            createCarousel() {
                document.getElementById('choiceMenu').style.display = 'none';
                this.placementMode = 'carousel';
                this.startDrawing();
            },

            createPanel() {
                document.getElementById('choiceMenu').style.display = 'none';
                this.placementMode = 'panel';
                this.panelMaterial = 'normal'; // Reset to default
                this.updateMaterialButtons();
                this.startDrawing();
            },

            selectPanelMaterial(material) {
                this.panelMaterial = material;
                this.updateMaterialButtons();
            },

            updateMaterialButtons() {
                const normalBtn = document.getElementById('materialNormal');
                const laserBtn = document.getElementById('materialLaser');

                if (this.panelMaterial === 'normal') {
                    normalBtn.style.background = 'white';
                    normalBtn.style.color = '#2c2c2c';
                    laserBtn.style.background = 'transparent';
                    laserBtn.style.color = 'white';
                } else {
                    normalBtn.style.background = 'transparent';
                    normalBtn.style.color = 'white';
                    laserBtn.style.background = 'white';
                    laserBtn.style.color = '#2c2c2c';
                }
            },

            createSpotlight() {
                document.getElementById('choiceMenu').style.display = 'none';

                const spotlight = this.createSpotlightObject();

                // Position on floor in center-front area
                spotlight.position.set(
                    (Math.random() - 0.5) * 4,
                    0,
                    -2 + (Math.random() - 0.5) * 2
                );

                this.scene.add(spotlight);
                this.spotlights.push(spotlight);
            },

            getWallTargetPosition(wall) {
                // Get position on the wall to aim spotlight at
                const { width, height, depth } = this.roomSize;

                switch (wall) {
                    case 'back':
                        return { x: 0, y: height / 2, z: -depth / 2 };
                    case 'front':
                        return { x: 0, y: height / 2, z: depth / 2 };
                    case 'left':
                        return { x: -width / 2, y: height / 2, z: 0 };
                    case 'right':
                        return { x: width / 2, y: height / 2, z: 0 };
                    default:
                        return { x: 0, y: height / 2, z: 0 };
                }
            },
            createCarouselFromDrawing() {
                const group = new THREE.Group();
                group.userData.type = 'carousel';
                group.userData.rotation = 0;
                group.userData.angularVelocity = 0;

                // Create THREE.Shape from drawn points (NO rectangle shadow!)
                const shape = new THREE.Shape();

                let minX = Infinity, maxX = -Infinity;
                let minY = Infinity, maxY = -Infinity;

                this.drawingPoints.forEach(point => {
                    minX = Math.min(minX, point.x);
                    maxX = Math.max(maxX, point.x);
                    minY = Math.min(minY, point.y);
                    maxY = Math.max(maxY, point.y);
                });

                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const scale = 1.2 / Math.max(maxX - minX, maxY - minY);

                this.drawingPoints.forEach((point, i) => {
                    const x = (point.x - centerX) * scale;
                    const y = -(point.y - centerY) * scale;
                    if (i === 0) shape.moveTo(x, y);
                    else shape.lineTo(x, y);
                });
                shape.closePath();

                // Base (metallic silver)
                const baseGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 32);
                const baseMaterial = new THREE.MeshStandardMaterial({
                    color: 0xc0c0c0,
                    metalness: 0.9,
                    roughness: 0.2
                });
                const base = new THREE.Mesh(baseGeometry, baseMaterial);
                base.position.y = 0.05;
                base.castShadow = false; // Base doesn't cast important shadow
                group.add(base);

                // Central axis (metallic silver) - MUST cast shadow on wall
                const axisGeometry = new THREE.CylinderGeometry(0.03, 0.03, 2.5, 16);
                const axis = new THREE.Mesh(axisGeometry, baseMaterial);
                axis.position.y = 1.25;
                axis.castShadow = true; // Rotation pole MUST cast shadow
                group.add(axis);

                // Rotating panel group with SHAPE shadows (NOT rectangle!)
                const panelsGroup = new THREE.Group();
                panelsGroup.position.y = 1.5;

                const numPanels = 8;
                const radius = 1.2;

                for (let i = 0; i < numPanels; i++) {
                    const angle = (i / numPanels) * Math.PI * 2;

                    // Use ShapeGeometry so shadows match drawn shape EXACTLY
                    const panelGeometry = new THREE.ShapeGeometry(shape);
                    const panelMaterial = new THREE.MeshStandardMaterial({
                        color: 0x404040,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.9,
                        metalness: 0,
                        roughness: 0.9
                    });

                    const panel = new THREE.Mesh(panelGeometry, panelMaterial);
                    panel.position.set(
                        Math.cos(angle) * radius,
                        0,
                        Math.sin(angle) * radius
                    );
                    panel.rotation.y = angle + Math.PI / 2;
                    panel.castShadow = true; // Shadow matches drawn shape!

                    panelsGroup.add(panel);
                }

                group.add(panelsGroup);
                group.userData.panelsGroup = panelsGroup;

                return group;
            },

            createSpotlightObject() {
                const group = new THREE.Group();
                group.userData.type = 'spotlight';
                group.userData.angle = Math.PI / 6;

                // Base stand (dark metal)
                const baseGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.05, 16);
                const baseMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    metalness: 0.5,
                    roughness: 0.5
                });
                const base = new THREE.Mesh(baseGeometry, baseMaterial);
                base.position.y = 0.025;
                group.add(base);

                // Light fixture
                const fixtureGeometry = new THREE.CylinderGeometry(0.08, 0.12, 0.3, 16);
                const fixture = new THREE.Mesh(fixtureGeometry, baseMaterial);
                fixture.position.y = 0.3;
                fixture.rotation.x = -Math.PI / 3;
                group.add(fixture);
                group.userData.fixture = fixture;

                // Pure WHITE spotlight (no colors) - ENHANCED for visible shadows
                const light = new THREE.SpotLight(0xffffff, 5, 40, Math.PI / 5, 0.8, 2);
                light.position.set(0, 0.4, 0);
                light.target.position.set(0, 0, -5);
                light.castShadow = true;
                // HIGH QUALITY shadow settings for sharp, visible shadows
                light.shadow.mapSize.width = 4096;  // Increased resolution
                light.shadow.mapSize.height = 4096;
                light.shadow.bias = -0.0005; // Darker shadows
                light.shadow.camera.near = 0.1;
                light.shadow.camera.far = 50;
                light.shadow.radius = 1; // Soft edges but visible
                group.add(light);
                group.add(light.target);
                group.userData.light = light;

                // NO helper - no visible rays
                group.userData.helper = null;

                return group;
            },

            startDrawing() {
                document.getElementById('drawing-interface').classList.add('active');
                this.drawingCtx.clearRect(0, 0, 400, 400);
                this.drawingPoints = [];
            },

            finishDrawing() {
                if (this.drawingPoints.length < 3) return;

                // Place objects in front of camera
                const position = { x: 0, z: 2, rotation: 0 };

                if (this.placementMode === 'carousel') {
                    const carousel = this.createCarouselFromDrawing();
                    carousel.position.set(position.x, 0, position.z);
                    carousel.rotation.y = position.rotation;
                    this.scene.add(carousel);
                    this.carousels.push(carousel);
                } else if (this.placementMode === 'panel') {
                    const panel = this.createPanelFromDrawing();
                    panel.position.set(position.x, 0, position.z);
                    panel.rotation.y = position.rotation;
                    this.scene.add(panel);
                    this.panels.push(panel);
                }

                this.placementMode = null;
                document.getElementById('drawing-interface').classList.remove('active');
                this.drawingCtx.clearRect(0, 0, 400, 400);
                this.drawingPoints = [];
            },

            createPanelFromDrawing() {
                const group = new THREE.Group();
                group.userData.type = 'panel';
                group.userData.material = this.panelMaterial;

                // Create THREE.Shape from drawn points (for EXACT shadow shape)
                const shape = new THREE.Shape();

                // Normalize and center the drawing points
                let minX = Infinity, maxX = -Infinity;
                let minY = Infinity, maxY = -Infinity;

                this.drawingPoints.forEach(point => {
                    minX = Math.min(minX, point.x);
                    maxX = Math.max(maxX, point.x);
                    minY = Math.min(minY, point.y);
                    maxY = Math.max(maxY, point.y);
                });

                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                const scale = 1.5 / Math.max(maxX - minX, maxY - minY); // Scale to fit in 1.5 units

                this.drawingPoints.forEach((point, i) => {
                    const x = (point.x - centerX) * scale;
                    const y = -(point.y - centerY) * scale; // Flip Y
                    if (i === 0) shape.moveTo(x, y);
                    else shape.lineTo(x, y);
                });
                shape.closePath();

                // Create geometry from SHAPE (NOT rectangle) - this creates proper shadow
                const geometry = new THREE.ShapeGeometry(shape);

                // Material based on selection
                let material;
                if (this.panelMaterial === 'laser') {
                    // TRUE LASER MATERIAL - rainbow holographic diffraction
                    // Create matcap with rainbow gradient for CD/holographic effect
                    const matcapCanvas = document.createElement('canvas');
                    matcapCanvas.width = 256;
                    matcapCanvas.height = 256;
                    const ctx = matcapCanvas.getContext('2d');

                    // Create radial rainbow gradient
                    const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(0.2, '#ff00ff');
                    gradient.addColorStop(0.4, '#0000ff');
                    gradient.addColorStop(0.6, '#00ffff');
                    gradient.addColorStop(0.8, '#ffff00');
                    gradient.addColorStop(1, '#ff0000');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, 256, 256);

                    const matcapTexture = new THREE.CanvasTexture(matcapCanvas);

                    material = new THREE.MeshMatcapMaterial({
                        matcap: matcapTexture,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.95
                    });
                } else {
                    // NORMAL material - translucent gray shadow
                    material = new THREE.MeshStandardMaterial({
                        color: 0x808080,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.85, // Increased opacity for darker shadows
                        metalness: 0.0,
                        roughness: 0.9
                    });
                }

                const mesh = new THREE.Mesh(geometry, material);
                // VERTICAL panel standing on floor
                mesh.position.y = 0.75;
                mesh.rotation.x = 0; // Face forward
                mesh.castShadow = true;
                mesh.receiveShadow = false;

                group.add(mesh);
                group.userData.mesh = mesh;

                // For laser panels, add FULL CHROMATIC DISPERSION layers
                // Rainbow streaks, interference bands, holographic diffraction
                if (this.panelMaterial === 'laser') {
                    // PRIMARY rainbow dispersion layers (like CD/prism/holographic foil)
                    const colors = [
                        0xff0000, 0xff4500, 0xff8c00, 0xffff00, // Red to Yellow
                        0x00ff00, 0x00ff7f, 0x00ffff, 0x0080ff, // Green to Cyan to Blue
                        0x0000ff, 0x4b0082, 0x8b00ff, 0xff00ff  // Blue to Violet to Magenta
                    ];

                    colors.forEach((color, i) => {
                        // Create multiple offset layers for chromatic dispersion
                        const disperseMaterial = new THREE.MeshBasicMaterial({
                            color: color,
                            transparent: true,
                            opacity: 0.25, // Stronger visibility
                            side: THREE.DoubleSide,
                            blending: THREE.AdditiveBlending // Additive for interference
                        });
                        const disperseMesh = new THREE.Mesh(geometry.clone(), disperseMaterial);

                        // Offset in different directions for rainbow spread
                        const angle = (i / colors.length) * Math.PI * 2;
                        const offsetX = Math.cos(angle) * 0.02;
                        const offsetZ = Math.sin(angle) * 0.02;
                        disperseMesh.position.set(offsetX, 0.75, offsetZ);
                        disperseMesh.scale.set(1.03 + i * 0.008, 1.03 + i * 0.008, 1);
                        group.add(disperseMesh);
                    });

                    // SECONDARY: Shimmering interference bands
                    const interferenceColors = [0xff00ff, 0x00ffff, 0xffff00];
                    interferenceColors.forEach((color, i) => {
                        const interferenceMaterial = new THREE.MeshBasicMaterial({
                            color: color,
                            transparent: true,
                            opacity: 0.15,
                            side: THREE.DoubleSide,
                            blending: THREE.AdditiveBlending
                        });
                        const interferenceMesh = new THREE.Mesh(geometry.clone(), interferenceMaterial);
                        const offset = (i - 1) * 0.025;
                        interferenceMesh.position.set(-offset, 0.75, offset);
                        interferenceMesh.scale.set(1.06, 1.06, 1);
                        group.add(interferenceMesh);
                    });
                }

                return group;
            },

            createColorPalette() {
                const palette = document.getElementById('colorPalette');
                this.lightColors.forEach((color, index) => {
                    const swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.backgroundColor = color;
                    if (index === 0) swatch.classList.add('selected');
                    swatch.onclick = () => {
                        document.querySelectorAll('.color-swatch').forEach(s =>
                            s.classList.remove('selected')
                        );
                        swatch.classList.add('selected');
                        this.currentLightColor = color;
                        if (this.selectedLight) {
                            this.selectedLight.userData.color = color;
                            this.selectedLight.userData.light.color.set(color);
                        }
                    };
                    palette.appendChild(swatch);
                });
            },

            setupEventListeners() {
                window.addEventListener('resize', () => this.onResize());

                this.renderer.domElement.addEventListener('mousedown', (e) => this.onMouseDown(e));
                this.renderer.domElement.addEventListener('mousemove', (e) => this.onMouseMove(e));
                this.renderer.domElement.addEventListener('mouseup', () => this.onMouseUp());

                // Drawing canvas
                this.drawingCanvas.addEventListener('mousedown', (e) => {
                    this.isDrawing = true;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints = [{
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    }];
                });

                this.drawingCanvas.addEventListener('mousemove', (e) => {
                    if (!this.isDrawing) return;
                    const rect = this.drawingCanvas.getBoundingClientRect();
                    this.drawingPoints.push({
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    });
                    this.updateDrawing();
                });

                this.drawingCanvas.addEventListener('mouseup', () => {
                    this.isDrawing = false;
                });
            },

            updateDrawing() {
                const ctx = this.drawingCtx;
                ctx.clearRect(0, 0, 400, 400);

                if (this.drawingPoints.length < 2) return;

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.moveTo(this.drawingPoints[0].x, this.drawingPoints[0].y);

                for (let i = 1; i < this.drawingPoints.length; i++) {
                    ctx.lineTo(this.drawingPoints[i].x, this.drawingPoints[i].y);
                }

                ctx.closePath();
                ctx.fill();
            },

            onMouseDown(e) {
                const mouse = new THREE.Vector2(
                    (e.clientX / window.innerWidth) * 2 - 1,
                    -(e.clientY / window.innerHeight) * 2 + 1
                );

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, this.camera);

                // Check for glowing point click
                if (this.glowingPoint) {
                    const glowIntersects = raycaster.intersectObject(this.glowingPoint, true);
                    if (glowIntersects.length > 0) {
                        // Show choice menu
                        const menu = document.getElementById('choiceMenu');
                        menu.style.display = 'flex';
                        menu.style.left = e.clientX + 'px';
                        menu.style.top = e.clientY + 'px';
                        this.glowingPointPosition.copy(this.glowingPoint.position);
                        return;
                    }
                }

                // Check for object selection
                const allObjects = [...this.carousels, ...this.panels, ...this.spotlights];
                const intersects = raycaster.intersectObjects(
                    allObjects.map(o => o.children).flat(),
                    true
                );

                if (intersects.length > 0) {
                    const object = intersects[0].object;
                    let parent = object;
                    while (parent.parent && !parent.userData.type) {
                        parent = parent.parent;
                    }

                    if (parent.userData.type === 'spotlight') {
                        this.selectedLight = parent;
                        this.selectedObject = null;
                    } else if (parent.userData.type !== 'glowingPoint') {
                        this.selectedObject = parent;
                        this.selectedLight = null;
                    }
                    this.isDragging = true;
                } else {
                    this.isRotatingView = true;
                    this.selectedObject = null;
                    this.selectedLight = null;
                }

                this.lastMouseX = e.clientX;
                this.lastMouseY = e.clientY;
            },

            onMouseMove(e) {
                const deltaX = e.clientX - this.lastMouseX;
                const deltaY = e.clientY - this.lastMouseY;

                if (this.isRotatingView) {
                    // Free 360° rotation - no limits
                    this.lookRotation.yaw -= deltaX * 0.003;

                    // Vertical rotation (pitch) with limits to prevent flipping
                    this.lookRotation.pitch -= deltaY * 0.003;
                    this.lookRotation.pitch = Math.max(
                        -Math.PI / 2 + 0.1,  // Don't look straight down
                        Math.min(Math.PI / 2 - 0.1, this.lookRotation.pitch)  // Don't look straight up
                    );

                    this.updateCameraPosition();
                } else if (this.isDragging && (this.selectedObject || this.selectedLight)) {
                    const obj = this.selectedObject || this.selectedLight;

                    // Handle carousel rotation with deltaX
                    if (obj.userData.type === 'carousel') {
                        // Add angular velocity based on horizontal drag
                        obj.userData.angularVelocity = deltaX * 0.003;
                    }

                    // Project mouse to floor plane for repositioning
                    const mouse = new THREE.Vector2(
                        (e.clientX / window.innerWidth) * 2 - 1,
                        -(e.clientY / window.innerHeight) * 2 + 1
                    );

                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, this.camera);

                    const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                    const intersection = new THREE.Vector3();
                    raycaster.ray.intersectPlane(floorPlane, intersection);

                    if (intersection && Math.abs(deltaY) > Math.abs(deltaX)) {
                        // Only move if vertical drag is dominant (prevents moving while rotating)
                        // CLAMP positions to stay within room boundaries
                        const { width, depth } = this.roomSize;
                        const margin = 0.5; // Small margin from walls

                        obj.position.x = Math.max(
                            -width / 2 + margin,
                            Math.min(width / 2 - margin, intersection.x)
                        );
                        obj.position.z = Math.max(
                            -depth / 2 + margin,
                            Math.min(depth / 2 - margin, intersection.z)
                        );
                    }
                }

                this.lastMouseX = e.clientX;
                this.lastMouseY = e.clientY;
            },

            onMouseUp() {
                this.isDragging = false;
                this.isRotatingView = false;
            },

            updateCameraPosition() {
                // FIXED elevated camera position: 2.4 meters high, centered
                // Camera CANNOT move - only rotation allowed
                // "Elevated observer inside gallery" - NOT top-down, NOT floor-level
                const cameraY = 2.4; // Elevated observer height
                const cameraX = 0;   // Center of room
                const cameraZ = 0;   // Center of room

                this.camera.position.set(cameraX, cameraY, cameraZ);

                // Calculate look direction from yaw and pitch (rotation only)
                const lookX = Math.cos(this.lookRotation.yaw) * Math.cos(this.lookRotation.pitch);
                const lookY = Math.sin(this.lookRotation.pitch);
                const lookZ = Math.sin(this.lookRotation.yaw) * Math.cos(this.lookRotation.pitch);

                // Set camera to look in that direction
                this.camera.lookAt(
                    this.camera.position.x + lookX,
                    this.camera.position.y + lookY,
                    this.camera.position.z + lookZ
                );
            },

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            },

            animate() {
                requestAnimationFrame(() => this.animate());

                const time = Date.now() * 0.001;

                // Pulsing glow on glowing point
                if (this.glowingPoint) {
                    const pulse = Math.sin(time * 2) * 0.3 + 0.7;
                    this.glowingPoint.material.emissiveIntensity = pulse * 1.2;
                    this.glowingPoint.scale.set(pulse, pulse, pulse);
                }

                // Update carousel rotations with friction
                this.carousels.forEach(carousel => {
                    if (carousel.userData.panelsGroup && carousel.userData.angularVelocity) {
                        carousel.userData.panelsGroup.rotation.y += carousel.userData.angularVelocity;

                        // Apply friction (gradual slowdown)
                        carousel.userData.angularVelocity *= 0.96;
                        // Stop when very slow
                        if (Math.abs(carousel.userData.angularVelocity) < 0.0001) {
                            carousel.userData.angularVelocity = 0;
                        }
                    }
                });

                this.renderer.render(this.scene, this.camera);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
